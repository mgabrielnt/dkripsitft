# ===============================
# KONFIGURASI GLOBAL TFT (Revisi)
# Dipakai oleh:
#   - src/models/train_tft_baseline.py
#   - src/models/train_tft_with_sentiment.py
# ===============================

# Target yang diprediksi TFT
# Gunakan "log_return_1d" untuk prediksi return harian (lebih stationary).
# Jika tetap ingin prediksi harga langsung, bisa ubah ke "close".
target: "close"

# Panjang input historis (encoder) dan horizon prediksi (decoder)
max_encoder_length: 60          # 60 hari historis (sekitar 3 bulan trading)
max_prediction_length: 5        # 5 hari ke depan (1 pekan trading)

# =========================
# TRAINING (GLOBAL)
# Berlaku untuk BASELINE & HYBRID
# =========================
batch_size: 64
max_epochs: 100                 # batas atas epoch, EarlyStopping akan stop lebih awal
learning_rate: 0.0005           # 5e-4 → cukup halus untuk TFT

# Hardware / kecepatan
accelerator: "gpu"              # pakai RTX 3050; kalau bermasalah, ganti "auto" atau "cpu"
devices: 1                      # 1 GPU
precision: "32-true"
num_workers: 3                  # worker DataLoader; kalau di Windows error/hang, ganti 0

loss: "mae"                     # MAE (point forecast). Bisa pakai "quantile" utk probabilistic.

# Early stopping
early_stopping_patience: 10     # hentikan training jika 10 epoch val_loss tidak membaik

# ================================
# BASELINE (TEKNIKAL SAJA)
# Dipakai oleh:
#   - train_tft_baseline.py
# ================================
hidden_size: 64
dropout: 0.10                   # baseline relatif sederhana → dropout cukup 0.1

# Layer & ukuran internal TFT
lstm_layers: 2
attention_head_size: 4
hidden_continuous_size: 32      # dimensi internal untuk fitur continuous

# ================================
# HYBRID (TEKNIKAL + SENTIMEN)
# Dipakai oleh:
#   - train_tft_with_sentiment.py
# ================================

# Hybrid sedikit lebih besar karena dia bawa fitur sentimen tambahan
hidden_size_hybrid: 128         # > baseline (64) agar bisa belajar interaksi tambahan
dropout_hybrid: 0.20            # dropout lebih besar utk cegah overfit

# Representasi & konfigurasi fitur sentimen
# "raw"  → pakai nilai sentimen kontinu (mean, vol, dsb.)
# "sign" → pakai bucket -1 / 0 / 1 (hari sangat negatif / netral / sangat positif)
sentiment_representation: "raw"
sentiment_bucket_threshold: 0.05   # ambang netral jika pakai "sign"

# Kumpulan fitur sentimen yang digunakan
# "final" → gunakan hasil seleksi via feature_filter_scores.csv (MI/F-test)
# "all"   → pakai semua fitur sentimen numerik yang ada di tft_master.csv
sentiment_feature_set: "final"

# Untuk dokumentasi saja (tidak dipakai langsung di script, tapi biar konsisten dgn PDF)
sentiment_clip_quantile: 0.995
