# --- AGGRESSIVE TUNING FOR LOW RMSE (FIXED BATCH_SIZE) ---

data:
  dataset_path: "data/processed/tft_master.csv"
  target: "close"
  time_idx: "time_idx"
  group_ids: ["ticker"]
  
  # Tetap Multi-Horizon (3 Hari)
  max_prediction_length: 3
  
  # Encoder dipendekkan (30 hari) agar model lebih responsif
  max_encoder_length: 30  
  min_encoder_length: 30

model:
  # Learning rate dikecilkan sedikit
  learning_rate: 0.0005
  
  # KAPASITAS OTAK DINAIKKAN (64 -> 128)
  hidden_size: 128
  
  # Attention Heads dinaikkan
  attention_head_size: 4
  
  # Dropout DITURUNKAN (0.05) agar berani menghafal
  dropout: 0.05
  
  hidden_continuous_size: 16
  output_size: 7
  log_interval: 10
  reduce_on_plateau_patience: 5

training:
  # --- PINDAHKAN BATCH SIZE KE SINI ---
  batch_size: 32
  
  max_epochs: 50
  patience: 15
  accelerator: "gpu"
  devices: 1
  gradient_clip_val: 0.1