# ==============================================================================
# CONFIG RSS (PURE TICKER)
# Catatan:
# - File ini hanya memuat query yang memang dipakai model saat ini.
# - Query MARKET sengaja dihapus karena pipeline saat ini tidak membentuk fitur
#   market-wide terpisah untuk masuk ke model.
# ==============================================================================

default_language: "id"
start_date_history: "2017-01-01"
max_articles_per_query: null

queries:
  - type: "google"
    ticker: "BBRI.JK"
    language: "id"
    query: '(BBRI OR "Bank Rakyat Indonesia" OR "BRI") saham'
  - type: "google"
    ticker: "BBRI.JK"
    language: "id"
    query: 'site:kontan.co.id (BBRI OR "Bank Rakyat Indonesia" OR "BRI")'

  - type: "google"
    ticker: "TLKM.JK"
    language: "id"
    query: '(TLKM OR "Telkom Indonesia" OR "Telkom") saham'
  - type: "google"
    ticker: "TLKM.JK"
    language: "id"
    query: 'site:kontan.co.id (TLKM OR "Telkom Indonesia" OR "Telkom")'

  - type: "google"
    ticker: "ASII.JK"
    language: "id"
    query: '(ASII OR "Astra International" OR "Astra") saham'
  - type: "google"
    ticker: "ASII.JK"
    language: "id"
    query: 'site:kontan.co.id (ASII OR "Astra International" OR "Astra")'

  - type: "google"
    ticker: "BMRI.JK"
    language: "id"
    query: '(BMRI OR "Bank Mandiri" OR "Mandiri") saham'
  - type: "google"
    ticker: "BMRI.JK"
    language: "id"
    query: 'site:kontan.co.id (BMRI OR "Bank Mandiri" OR "Mandiri")'
